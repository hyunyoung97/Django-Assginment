<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>User List</title>
    <style>
      body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 10px;
            margin: 5px 0;
            background: #eaeaea;
            border-radius: 5px;
            transition: background 0.3s;
        }
        li:hover {
            background: #d4d4d4;
        }
        a {
            text-decoration: none;
            color: #333;
        }
    </style>
</head>
<body>
  <div class="container">
    <h1>User List</h1>
    <ul>
      <!-- db에서 가져온 사용자 목록을 표시 -->
      {% for user in data %}
        <li>
          <!-- 각 사용자의 상세 정보 페이지로 이동하는 링크 -->
          <a href="{% url 'user_info' user.id %}">{{ user.name }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
